name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows release
        run: |
          flutter pub get
          flutter build windows --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: powershell
        run: |
          $iscc = Get-ChildItem -Path 'C:\Program Files', 'C:\Program Files (x86)', 'C:\ProgramData\chocolatey' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Could not find ISCC.exe after installing Inno Setup.' }
          & $iscc.FullName packaging/windows/vce_unpacked.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VCEUnpacked-Windows-Installer
          path: packaging/windows/output/VCEUnpackedSetup.exe
